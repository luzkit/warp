name: Fork macOS installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'fork-v*'
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/fork-release.yml'
      - '.cargo/**'
      - 'app/**'
      - 'crates/**'
      - 'resources/**'
      - 'script/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'about.toml'
      - 'about.hbs'

permissions:
  contents: read

concurrency:
  group: fork-installer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-script:
    if: ${{ github.repository == 'luzkit/warp' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Check packaging script
        run: |
          bash -n script/macos/bundle-fork
          shellcheck script/macos/bundle-fork
      - name: Check workflow and embedded shell
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/fork-release.yml

  build:
    if: ${{ github.repository == 'luzkit/warp' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs: check-script
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_INCREMENTAL: '0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          lfs: true
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26'
      - name: Install build tools
        run: |
          test "$(uname -m)" = arm64
          rustup show active-toolchain
          brew install protobuf jq pkgconf
          xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal --version
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: fork-macos-arm64-release-v1
          cache-all-crates: false
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Install packaging tools
        run: |
          ./script/install_cargo_bundle
          ./script/install_cargo_release_deps --no-build-deps
      - name: Build installer
        id: bundle
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            version="$REF_NAME"
          else
            version="snapshot-${SOURCE_SHA:0:12}"
          fi
          ./script/macos/bundle-fork "$version" "$RUNNER_TEMP/fork-installer"
      - name: Upload installer and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: ${{ steps.bundle.outputs.artifact_dir }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    if: ${{ github.repository == 'luzkit/warp' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/fork-v') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: WarpOss-macos-arm64-*
          merge-multiple: true
          path: installer
      - name: Create draft fork prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Apple Silicon macOS installer from the luzkit/warp fork.

          Download the DMG and drag WarpOss into Applications. This build is ad hoc signed and is not Apple-notarized; macOS may require first-launch approval in Privacy & Security.

          Native persistent terminal sessions are included. Name or detach a session from its pane menu, then use **Attach to Session** in Warp search to reconnect.

          Source commit: $SOURCE_SHA. The matching SHA-256 checksum and build metadata are attached.

          [Installation and build details](https://github.com/luzkit/warp/blob/$RELEASE_TAG/specs/GH9416/fork-installer.md)
          EOF
          gh release create "$RELEASE_TAG" installer/* --verify-tag --draft --prerelease \
            --title "WarpOss $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
