name: Fork macOS installer

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/fork-release.yml'
      - '.cargo/**'
      - 'app/**'
      - 'crates/**'
      - 'resources/**'
      - 'script/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'about.toml'
      - 'about.hbs'

permissions:
  contents: read

concurrency:
  group: fork-installer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-script:
    if: ${{ github.repository == 'luzkit/warp' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    outputs:
      build_required: ${{ steps.changes.outputs.build_required }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select validation scope
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import subprocess

          packaging = {
              '.github/workflows/fork-release.yml',
              'script/ci/fork-notarized-release.yml',
              'script/macos/bundle-fork',
              'script/macos/fork_signing.py',
              'script/macos/notarize_fork.py',
              'script/macos/test_fork_signing.py',
              'script/macos/test_notarize_fork.py',
              'specs/GH9416/fork-installer.md',
          }
          build = True
          if os.environ['EVENT_NAME'] == 'pull_request':
              changed = subprocess.check_output(
                  ['git', 'diff', '--name-only', '-z', 'HEAD^1', 'HEAD']
              ).decode().split('\0')
              build = any(path and path not in packaging for path in changed)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'build_required={str(build).lower()}\n')
          PYTHON
      - name: Test signing and artifact validation
        run: python3 -m unittest discover -s script/macos -p 'test_*fork*.py'
      - name: Check packaging script
        run: |
          bash -n script/macos/bundle-fork
          shellcheck script/macos/bundle-fork
      - name: Check workflow and embedded shell
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          printf 'self-hosted-runner:\n  labels: [personal-mac]\n' > "$RUNNER_TEMP/actionlint.yaml"
          "$RUNNER_TEMP/actionlint" -config-file "$RUNNER_TEMP/actionlint.yaml" \
            .github/workflows/fork-release.yml script/ci/fork-notarized-release.yml

  build:
    if: ${{ needs.check-script.outputs.build_required == 'true' }}
    needs: check-script
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_INCREMENTAL: '0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          lfs: true
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26'
      - name: Install build tools
        run: |
          test "$(uname -m)" = arm64
          rustup show active-toolchain
          brew install protobuf jq pkgconf
          xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal --version
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: fork-macos-arm64-release-v1
          cache-all-crates: false
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Install packaging tools
        run: |
          ./script/install_cargo_bundle
          ./script/install_cargo_release_deps --no-build-deps
      - name: Build installer
        id: bundle
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          version="snapshot-${SOURCE_SHA:0:12}"
          ./script/macos/bundle-fork "$version" "$RUNNER_TEMP/fork-installer"
      - name: Upload installer and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: ${{ steps.bundle.outputs.artifact_dir }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
